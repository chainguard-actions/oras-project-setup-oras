name: Test custom version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-oras
        uses: .
        with:
          version: "1.1.0"
      - name: Assert oras is installed and accessible
        run: |
          echo "Checking oras is in PATH..."
          if ! command -v oras &>/dev/null; then
            echo "FAIL: oras command not found in PATH"
            exit 1
          fi
          echo "PASS: oras found at $(command -v oras)"
      - name: Assert oras version is 1.1.0
        run: |
          VERSION_OUTPUT=$(oras version 2>&1 || true)
          echo "oras version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.1.0"; then
            echo "PASS: oras version 1.1.0 confirmed"
          else
            echo "FAIL: expected version 1.1.0 in output"
            exit 1
          fi
