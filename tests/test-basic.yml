name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
      - name: Assert oras is installed
        run: |
          echo "Checking oras is available in PATH..."
          if ! command -v oras &>/dev/null; then
            echo "FAIL: oras command not found in PATH"
            exit 1
          fi
          echo "PASS: oras is available"
      - name: Assert oras default version
        run: |
          VERSION_OUTPUT=$(oras version)
          echo "oras version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.3.1"; then
            echo "FAIL: expected default version 1.3.1 in oras version output"
            exit 1
          fi
          echo "PASS: default version 1.3.1 is installed"
