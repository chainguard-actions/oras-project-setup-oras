name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-oras
        uses: .
      - name: Assert oras is installed and on PATH
        run: |
          echo "Checking oras binary..."
          which oras
          if [ $? -ne 0 ]; then
            echo "FAIL: oras not found on PATH"
            exit 1
          fi
          echo "PASS: oras found on PATH"
      - name: Assert oras version matches default (1.3.1)
        run: |
          VERSION=$(oras version 2>&1 | head -1 | awk '{print $NF}')
          echo "actual version: $VERSION"
          if [ "$VERSION" != "1.3.1" ]; then
            echo "FAIL: expected version 1.3.1 but got $VERSION"
            exit 1
          fi
          echo "PASS: oras version is $VERSION"
