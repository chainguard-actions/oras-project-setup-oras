name: Test custom URL with checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          # Use a real ORAS pre-release tarball with its known SHA256 checksum
          # from the README example: https://github.com/oras-project/oras/releases/download/v1.2.0-beta.1/
          url: https://github.com/oras-project/oras/releases/download/v1.2.0-beta.1/oras_1.2.0-beta.1_linux_amd64.tar.gz
          checksum: 37d86f848f7c7c471035cf8218f06372fd72a9fbdca1e10f509738e222b3b2be
      - name: Assert oras is installed via custom URL
        run: |
          echo "Checking oras binary..."
          if ! command -v oras &>/dev/null; then
            echo "FAIL: oras command not found in PATH"
            exit 1
          fi
          echo "PASS: oras is available"
      - name: Assert custom version is installed
        run: |
          VERSION_OUTPUT="$(oras version)"
          echo "oras version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.2.0"; then
            echo "FAIL: expected version 1.2.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: correct custom version installed via URL"
