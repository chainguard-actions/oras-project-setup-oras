name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.0
      - name: Assert oras 1.2.0 installed
        run: |
          set -e
          command -v oras || { echo "FAIL: oras not on PATH"; exit 1; }
          OUT="$(oras version)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "1.2.0"; then
            echo "FAIL: expected version 1.2.0"
            exit 1
          fi
          echo "PASS"
