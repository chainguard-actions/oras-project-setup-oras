name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.1.0
      - name: Assert oras is installed
        run: |
          echo "Checking oras binary..."
          if ! command -v oras &>/dev/null; then
            echo "FAIL: oras binary not found in PATH"
            exit 1
          fi
          echo "PASS: oras found at $(command -v oras)"
      - name: Assert specific version is installed
        run: |
          VERSION_OUTPUT=$(oras version)
          echo "oras version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.1.0"; then
            echo "FAIL: expected version 1.1.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: correct version 1.1.0 installed"
